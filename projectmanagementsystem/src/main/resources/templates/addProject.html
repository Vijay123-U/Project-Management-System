<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Project</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Add / Edit Project</h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/saveProject}" th:object="${project}" method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">

                            <label class="form-label">Project Name</label>

                            <input type="text" class="form-control" th:field="*{projectName}" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Description</label>

                            <input type="text" class="form-control" th:field="*{description}" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Assign Employee</label>

                            <select class="form-select" th:field="*{employee}">

                                <option value="">-- Select Employee --</option>

                                <option
                                        th:each="employee:${employees}"
                                        th:value="${employee.id}"
                                        th:text="${employee.name}">
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/projects" class="btn btn-secondary">Back</a>

                            <button class="btn btn-success">
                                Save Project
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
