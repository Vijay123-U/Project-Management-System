<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Employee Work Report</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between mb-4">

        <h2 class="text-primary">
            Employee Work Report
        </h2>

        <a href="/" class="btn btn-secondary">
            Home
        </a>

    </div>

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-dark">

        <tr>

            <th>Employee</th>

            <th>Project</th>

            <th>Task</th>

            <th>Status</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="task:${tasks}">

            <td th:text="${task.project!=null && task.project.employee!=null ? task.project.employee.name:'Not Assigned'}"></td>

            <td th:text="${task.project!=null ? task.project.projectName:'Not Assigned'}"></td>

            <td th:text="${task.taskName}"></td>

            <td th:text="${task.status}"></td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
