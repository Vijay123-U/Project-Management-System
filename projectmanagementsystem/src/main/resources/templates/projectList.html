<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project List</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">Project List</h2>

        <div>
            <a href="/" class="btn btn-secondary">Home</a>
            <a href="/addProject" class="btn btn-success">Add Project</a>
        </div>

    </div>

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Project Name</th>
            <th>Description</th>
            <th>Assigned Employee</th>
            <th>Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="project : ${projects}">

            <td th:text="${project.id}"></td>
            <td th:text="${project.projectName}"></td>
            <td th:text="${project.description}"></td>

            <td th:text="${project.employee != null ? project.employee.name : 'Not Assigned'}"></td>

            <td>

                <a th:href="@{/editProject/{id}(id=${project.id})}" class="btn btn-primary btn-sm">Edit</a>

                <a th:href="@{/deleteProject/{id}(id=${project.id})}"
                   class="btn btn-secondary btn-sm"
                   onclick="return confirm('Delete this project?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
