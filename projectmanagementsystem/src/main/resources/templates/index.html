<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Project Management System</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="text-center mb-5">
        <h1 class="display-4 text-primary">
            Project Management System
        </h1>

        <p class="lead">
            Employee • Project • Task Management
        </p>
    </div>

    <div class="row g-4">

        <!-- Employee Card -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>Employees</h3>

                    <br>

                    <a href="/employees" class="btn btn-primary">
                        View Employees
                    </a>

                    <br><br>

                    <a href="/addEmployee" class="btn btn-success">
                        Add Employee
                    </a>

                </div>

            </div>

        </div>

        <!-- Project Card -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>Projects</h3>

                    <br>

                    <a href="/projects" class="btn btn-primary">
                        View Projects
                    </a>

                    <br><br>

                    <a href="/addProject" class="btn btn-success">
                        Add Project
                    </a>

                </div>

            </div>

        </div>

        <!-- Task Card -->
        <div class="col-md-4">

            <div class="card shadow">

                <div class="card-body text-center">

                    <h3>Tasks</h3>

                    <br>

                    <a href="/tasks" class="btn btn-primary">
                        View Tasks
                    </a>

                    <br><br>

                    <a href="/addTask" class="btn btn-success">
                        Add Task
                    </a>

                </div>

            </div>

        </div>

    </div>

    <div class="text-center mt-5">

        <a href="/workReport" class="btn btn-warning btn-lg">
            Employee Work Report
        </a>

    </div>

</div>

</body>
</html>
