<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Task List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">Task List</h2>

        <div>

            <a href="/" class="btn btn-secondary">Home</a>

            <a href="/addTask" class="btn btn-success">Add Task</a>

        </div>

    </div>

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-dark">

        <tr>

            <th>ID</th>

            <th>Task Name</th>

            <th>Status</th>

            <th>Assigned Project</th>

            <th>Action</th>

        </tr>

        </thead>

        <tbody>

        <tr th:each="task:${tasks}">

            <td th:text="${task.id}"></td>

            <td th:text="${task.taskName}"></td>

            <td th:text="${task.status}"></td>

            <td th:text="${task.project!=null ? task.project.projectName:'Not Assigned'}"></td>

            <td>

                <a th:href="@{/editTask/{id}(id=${task.id})}" class="btn btn-primary btn-sm">
                    Edit
                </a>

                <a th:href="@{/deleteTask/{id}(id=${task.id})}"
                   class="btn btn-secondary btn-sm"
                   onclick="return confirm('Delete this task?')">
                    Delete
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
