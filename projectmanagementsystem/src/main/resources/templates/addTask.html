<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Add Task</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow">

                <div class="card-header bg-primary text-white text-center">

                    <h3>Add / Edit Task</h3>

                </div>

                <div class="card-body">

                    <form th:action="@{/saveTask}" th:object="${task}" method="post">

                        <input type="hidden" th:field="*{id}"/>

                        <div class="mb-3">

                            <label class="form-label">Task Name</label>

                            <input class="form-control" type="text" th:field="*{taskName}" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Status</label>

                            <input class="form-control" type="text" th:field="*{status}" required>

                        </div>

                        <div class="mb-3">

                            <label class="form-label">Assign Project</label>

                            <select class="form-select" th:field="*{project}">

                                <option value="">-- Select Project --</option>

                                <option
                                        th:each="project:${projects}"
                                        th:value="${project.id}"
                                        th:text="${project.projectName}">
                                </option>

                            </select>

                        </div>

                        <div class="d-flex justify-content-between">

                            <a href="/tasks" class="btn btn-secondary">
                                Back
                            </a>

                            <button class="btn btn-success">
                                Save Task
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
