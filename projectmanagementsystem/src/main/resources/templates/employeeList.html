<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Employee List</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2 class="text-primary">Employee List</h2>

        <div>

            <a href="/" class="btn btn-secondary">
                Home
            </a>

            <a href="/addEmployee" class="btn btn-success">
                Add Employee
            </a>

        </div>

    </div>

    <table class="table table-bordered table-hover table-striped shadow">

        <thead class="table-dark">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th width="180">Action</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="employee : ${employees}">

            <td th:text="${employee.id}"></td>

            <td th:text="${employee.name}"></td>

            <td th:text="${employee.email}"></td>

            <td>

                <a th:href="@{/editEmployee/{id}(id=${employee.id})}"
                   class="btn btn-primary btn-sm">

                    Edit

                </a>

                <a th:href="@{/deleteEmployee/{id}(id=${employee.id})}"
                   class="btn btn-secondary btn-sm"
                   onclick="return confirm('Delete this employee?')">

                    Delete

                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

</body>
</html>
